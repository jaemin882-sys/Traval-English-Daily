name: Update Travel English Daily

on:
  schedule:
    - cron: "30 7 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate daily lesson
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: python update.py

      - name: Commit lesson and history
        run: |
          git config user.name "travel-english-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lesson.json history/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update travel English lesson"
            git push
          fi
